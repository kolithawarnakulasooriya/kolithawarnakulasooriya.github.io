name: Validate branch changes

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check generated media
        run: node scripts/generate-media.mjs --check

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc --noEmit --incremental false

      - name: Build with Next.js
        run: yarn build

      - name: Check exported content
        run: node tests/content.test.cjs
